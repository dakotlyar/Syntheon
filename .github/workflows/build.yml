name: Build SynBench

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build AppImage
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: SynBench-Linux
          path: SynBench-x86_64.AppImage
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install --upgrade pyinstaller numpy psutil PySide6

      - name: Build with PyInstaller
        run: python -m PyInstaller synbench.spec --clean

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SynBench-Windows
          path: dist\SynBench
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package artifacts
        run: |
          cd artifacts
          zip -r SynBench-Windows.zip SynBench-Windows/
          mv SynBench-Linux/SynBench-x86_64.AppImage .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/SynBench-x86_64.AppImage
            artifacts/SynBench-Windows.zip
          generate_release_notes: true
