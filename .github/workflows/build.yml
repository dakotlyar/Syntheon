name: Build SynBench

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build AppImage
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: SynBench-Linux
          path: SynBench-x86_64.AppImage
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.11'

      - name: Install dependencies
        run: pip install --upgrade pyinstaller numpy psutil PySide6

      - name: Build with PyInstaller
        run: python -m PyInstaller synbench.spec --clean

      - name: Bundle sidecar Python (for optional GPU/NPU plugin installs)
        shell: pwsh
        run: |
          $ver = '3.10.11'
          $embedDir = 'dist\SynBench\python-embed'
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$ver/python-$ver-embed-amd64.zip" -OutFile python-embed.zip
          Expand-Archive -Path python-embed.zip -DestinationPath $embedDir -Force
          $pth = Get-ChildItem "$embedDir\python*._pth" | Select-Object -First 1
          (Get-Content $pth.FullName) -replace '^#import site', 'import site' | Set-Content $pth.FullName
          Invoke-WebRequest -Uri 'https://bootstrap.pypa.io/get-pip.py' -OutFile get-pip.py
          & "$embedDir\python.exe" get-pip.py --no-warn-script-location

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($env:GITHUB_REF_TYPE -ne 'tag') { $version = '0.0.0-dev' }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss "/DMyAppVersion=$version"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SynBench-Windows-Installer
          path: installer_output\SynBench-Setup.exe
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package artifacts
        run: |
          cd artifacts
          mv SynBench-Linux/SynBench-x86_64.AppImage .
          mv SynBench-Windows-Installer/SynBench-Setup.exe .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/SynBench-x86_64.AppImage
            artifacts/SynBench-Setup.exe
          generate_release_notes: true
