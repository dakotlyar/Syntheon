name: ARM64 sysroot

# Pre-warms the cache (Ubuntu 24.04 "noble" sysroot: the Linux ARM64 floor) for the Linux ARM64 cross job (P26) whenever the package
# list or the scripts that build the sysroot change. The cross job also builds
# the sysroot itself on a cache miss, so this workflow is an optimisation.

on:
  push:
    branches: [main, 'phase-*']
    paths:
      - packaging/linux/linux-arm64-sysroot.txt
      - packaging/linux/make-sysroot.sh
      - packaging/linux/fix-sysroot-symlinks.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sysroot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: sysroot-arm64
          key: sysroot-arm64-noble-${{ hashFiles('packaging/linux/linux-arm64-sysroot.txt', 'packaging/linux/make-sysroot.sh', 'packaging/linux/fix-sysroot-symlinks.py') }}

      - name: Build the sysroot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mmdebstrap
          bash packaging/linux/make-sysroot.sh sysroot-arm64

      - name: What is in it
        run: |
          du -sh sysroot-arm64
          find sysroot-arm64/usr/lib/aarch64-linux-gnu -maxdepth 1 -name "lib*.so*" | head -20
