name: CI

on:
  push:
    branches: [main, 'phase-*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  # release.yml runs the same jobs on a tag, then publishes their artifacts.
  workflow_call:

# Least privilege: CI only reads the repository (release.yml's publish job has its own write grant).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.12.0"
  # R1: aqtinstall 3.3.0 (latest release) can't find Qt 6.12.0 for Windows
  # (Qt moved 6.12 to per-arch repo folders). Its master at this commit can,
  # for both Linux and Windows. Move back to a release once one ships.
  AQT_SOURCE: "git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libegl1-mesa-dev \
            libxkbcommon-dev libfontconfig1-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4 (= v4.4.1)
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
          aqtsource: ${{ env.AQT_SOURCE }}

      # OpenSSL (§11, R8): its build is cached, keyed on everything that goes into
      # it; cmake/OpenSSL.cmake checks the stamp in the folder and rebuilds on
      # any mismatch.
      - name: Compiler version (OpenSSL cache key)
        id: cc
        run: echo "version=$(gcc -dumpfullversion)" >> "$GITHUB_OUTPUT"
      - name: OpenSSL cache
        uses: actions/cache@v4
        with:
          path: openssl-root
          key: openssl-linux-x86_64-gcc${{ steps.cc.outputs.version }}-${{ hashFiles('cmake/OpenSSL.cmake', 'cmake/openssl/**') }}

      - name: Configure
        run: cmake --preset linux-x64-release "-DSYNBENCH_OPENSSL_ROOT=$GITHUB_WORKSPACE/openssl-root"

      - name: Build
        run: cmake --build --preset linux-x64-release

      # qmllint with the build's module (§13): all_qmllint_json lints the
      # SynBench module's own files with its qmldir and C++ types, so imports,
      # components and the C++ singletons resolve; the Qt Quick tests are linted
      # against the built SynBench and SynBenchTest modules. ANY warning fails
      # (qmllint-gate.py reads the JSON reports: qmllint's text output leaves
      # some counted warnings out). A missing report fails too.
      - name: QML (qmllint, module-aware; any warning fails)
        run: |
          cmake --build --preset linux-x64-release --target all_qmllint_json || true
          "$QT_ROOT_DIR/bin/qmllint" -I build/linux-x64-release/src/app -I build/linux-x64-release/tests/qml \
            -I "$QT_ROOT_DIR/qml" --json build/linux-x64-release/tests_qml_qmllint.json tests/qml/*.qml || true
          python3 packaging/checks/qmllint-gate.py \
            build/linux-x64-release/synbench_ui_qmllint.json build/linux-x64-release/tests_qml_qmllint.json

      # AP5-R2-4: test-only binaries never ship. Install rules arrive with
      # packaging (task 19); until then the install tree is empty.
      - name: Check shipping trees for test binaries
        shell: bash
        run: |
          cmake --install build/linux-x64-release --prefix stage
          bash packaging/checks/no-test-binaries.sh stage

      - name: Unit tests
        run: ctest --preset linux-x64-release --output-on-failure

      # §10 smoke launch: loads the UI, runs every stub fast against a
      # temporary history (no elevation) and exits 0.
      - name: Smoke launch
        timeout-minutes: 3
        env:
          SYNBENCH_SMOKE: "1"
          QT_QPA_PLATFORM: offscreen
        run: build/linux-x64-release/bin/SynBench

      # A failing (or crashing) test must leave something to read: the tail of
      # every test log, the failed tests re-run verbosely, and the logs as an
      # artifact.
      - name: Failed test details
        if: failure()
        shell: bash
        run: |
          for f in build/linux-x64-release/test-logs/*.txt; do
            [ -f "$f" ] || continue
            echo "::group::$f (last 100 lines)"; tail -n 100 "$f"; echo "::endgroup::"
          done
          ctest --preset linux-x64-release --rerun-failed --output-on-failure || true
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v6
        # Best effort: a GitHub storage quota problem must not fail the job.
        continue-on-error: true
        with:
          retention-days: 3
          name: test-logs-linux-x64
          path: |
            build/linux-x64-release/test-logs
            build/linux-x64-release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      # The live system snapshot on this runner, printed for review (ctest
      # hides test output on success).
      - name: System snapshot
        run: ctest --preset linux-x64-release -R tst_sysinfo_live -V --output-on-failure

  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      # ilammy/msvc-dev-cmd has no Node 24 release yet (v1.13.0 runs on
      # Node 20), so this step still triggers the Node 20 deprecation notice.
      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1 (= v1.13.0)
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4 (= v4.4.1)
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          aqtsource: ${{ env.AQT_SOURCE }}

      # OpenSSL's x64 AES-NI / SHA-NI / VAES code is NASM source (§11.2). nasm.us
      # publishes no checksums or signatures; this SHA-256 is the one winget's
      # NASM.NASM 2.16.03 manifest records for the same file, and the download
      # from nasm.us matched it on 2026-10-16.
      - name: Install NASM 2.16.03
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\nasm-2.16.03-installer-x64.exe"
          Invoke-WebRequest -Uri https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-installer-x64.exe -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '657e1252676cfb26a008835c20a760f731c8e0414469a4ed0f83f0fb059cdd35') { throw "NASM installer has sha256 $hash" }
          # NSIS: silent, into a folder of our own (/D= last, unquoted).
          $p = Start-Process -FilePath $exe -ArgumentList '/S', "/D=$env:RUNNER_TEMP\nasm" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "NASM installer exited $($p.ExitCode)" }
          & "$env:RUNNER_TEMP\nasm\nasm.exe" -v
          if ($LASTEXITCODE -ne 0) { throw "nasm does not run" }
          "$env:RUNNER_TEMP\nasm" | Out-File -FilePath $env:GITHUB_PATH -Append

      # OpenSSL (§11, R8): its build is cached, keyed on everything that goes into
      # it; cmake/OpenSSL.cmake checks the stamp in the folder and rebuilds on
      # any mismatch. nmake builds it on one core: 10-15 minutes uncached.
      - name: OpenSSL cache
        uses: actions/cache@v4
        with:
          path: openssl-root
          key: openssl-VC-WIN64A-msvc${{ env.VCToolsVersion }}-nasm2.16.03-${{ hashFiles('cmake/OpenSSL.cmake', 'cmake/openssl/**') }}

      - name: Configure
        shell: pwsh
        run: cmake --preset windows-x64-release "-DSYNBENCH_OPENSSL_ROOT=$env:GITHUB_WORKSPACE/openssl-root"

      - name: Build
        run: cmake --build --preset windows-x64-release

      # For diagnosis when the manifest check below fails: the real link command.
      - name: Show how SynBench.exe was linked
        shell: pwsh
        run: ninja -C build/windows-x64-release -t commands bin/SynBench.exe | Select-Object -Last 1

      - name: The exe has exactly one manifest, requesting administrator rights
        shell: pwsh
        run: ./packaging/checks/manifest-check.ps1 -Exe build/windows-x64-release/bin/SynBench.exe

      # AP5-R2-4: test-only binaries never ship. Install rules arrive with
      # packaging (task 19); until then the install tree is empty.
      - name: Check shipping trees for test binaries
        shell: bash
        run: |
          cmake --install build/windows-x64-release --prefix stage
          bash packaging/checks/no-test-binaries.sh stage

      - name: Unit tests
        run: ctest --preset windows-x64-release --output-on-failure

      # §10 smoke launch (a GUI exe). run-smoke.ps1 cannot hang: the Windows error
      # mode turns a missing DLL into an immediate exit code instead of a dialog,
      # and the wait is bounded (60 s, then the process tree is killed).
      - name: Smoke launch
        timeout-minutes: 3
        shell: pwsh
        run: ./packaging/checks/run-smoke.ps1 -Exe build/windows-x64-release/bin/SynBench.exe -TimeoutSeconds 60

      # A failing (or crashing) test must leave something to read: the tail of
      # every test log, the failed tests re-run verbosely, and the logs as an
      # artifact.
      - name: Failed test details
        if: failure()
        shell: bash
        run: |
          for f in build/windows-x64-release/test-logs/*.txt; do
            [ -f "$f" ] || continue
            echo "::group::$f (last 100 lines)"; tail -n 100 "$f"; echo "::endgroup::"
          done
          ctest --preset windows-x64-release --rerun-failed --output-on-failure || true
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v6
        # Best effort: a GitHub storage quota problem must not fail the job.
        continue-on-error: true
        with:
          retention-days: 3
          name: test-logs-windows-x64
          path: |
            build/windows-x64-release/test-logs
            build/windows-x64-release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      # The live system snapshot on this runner, printed for review (ctest
      # hides test output on success).
      - name: System snapshot
        run: ctest --preset windows-x64-release -R tst_sysinfo_live -V --output-on-failure

  # ---------------------------------------------------------------- packaging
  # The packaged builds use the *-package presets: no developer hooks, no
  # tests. Each job proves that (no SYNBENCH_ names in the binaries) before it
  # makes an installer.

  package-linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build and runtime-library dependencies
        run: |
          sudo apt-get update
          # The -dev packages to build; the runtime libraries Qt's xcb and
          # wayland plugins need are bundled from these (make-appdir.py).
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libegl1-mesa-dev \
            libxkbcommon-dev libfontconfig1-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xkb1 libxcb-xinerama0 libxcb-randr0 libxcb-sync1 libxcb-xfixes0 \
            libxkbcommon-x11-0 libwayland-egl1 \
            desktop-file-utils appstream

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4 (= v4.4.1)
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
          aqtsource: ${{ env.AQT_SOURCE }}

      # OpenSSL (§11, R8): its build is cached, keyed on everything that goes into
      # it; cmake/OpenSSL.cmake checks the stamp in the folder and rebuilds on
      # any mismatch.
      - name: Compiler version (OpenSSL cache key)
        id: cc
        run: echo "version=$(gcc -dumpfullversion)" >> "$GITHUB_OUTPUT"
      - name: OpenSSL cache
        uses: actions/cache@v4
        with:
          path: openssl-root
          key: openssl-linux-x86_64-gcc${{ steps.cc.outputs.version }}-${{ hashFiles('cmake/OpenSSL.cmake', 'cmake/openssl/**') }}

      - name: Configure (packaging preset)
        run: cmake --preset linux-x64-package "-DSYNBENCH_OPENSSL_ROOT=$GITHUB_WORKSPACE/openssl-root"

      - name: Build
        run: cmake --build --preset linux-x64-package

      # §11.2: the hardware AES and SHA-256 code is in libcrypto; the check also
      # has to fail without it (self-test, and on a library that isn't libcrypto).
      - name: libcrypto has the hardware crypto path (AES-NI, SHA-NI)
        run: |
          python3 packaging/checks/crypto-symbols.py openssl-root/lib/libcrypto.a --arch x86_64 --self-test
          if python3 packaging/checks/crypto-symbols.py build/linux-x64-package/_deps/synbench_zlib-build/libz.a --arch x86_64; then
            echo "::error::crypto-symbols.py passed on zlib"; exit 1
          fi

      - name: Install
        run: cmake --install build/linux-x64-package --prefix stage

      - name: The packaged binaries carry no developer hooks and no test binaries
        run: |
          bash packaging/checks/no-dev-hooks.sh stage
          bash packaging/checks/no-test-binaries.sh stage

      - name: Build the AppDir
        run: |
          python3 packaging/linux/make-appdir.py \
            --install-tree stage --appdir AppDir --qt "$QT_ROOT_DIR" \
            --qml-root src/app/qml --qml-scanner "$QT_ROOT_DIR/libexec/qmlimportscanner"

      - name: Static checks on the AppDir (architecture, libraries, glibc 2.35 floor)
        run: |
          python3 packaging/checks/elf-check.py AppDir --arch x86_64
          # Both Qt platform plugins: native Wayland and xcb (the X11/XWayland fallback).
          for f in libqwayland.so libqxcb.so; do test -f "AppDir/usr/plugins/platforms/$f" || { echo "::error::$f is not in the AppDir"; exit 1; }; done
          test -n "$(find AppDir/usr/plugins/wayland-shell-integration -name 'libxdg-shell.so')"
          bash packaging/checks/no-dev-hooks.sh AppDir
          bash packaging/checks/no-test-binaries.sh AppDir
          bash packaging/checks/test-elf-check.sh
          desktop-file-validate AppDir/io.github.dakotlyar.SynBench.desktop

      - name: Build the AppImage
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          bash packaging/linux/make-appimage.sh AppDir "SynBench-$version-x86_64.AppImage" x86_64 appimage-tools
          echo "APPIMAGE_FILE=SynBench-$version-x86_64.AppImage" >> "$GITHUB_ENV"

      # The helper trust check (linux_helper_client.cpp) believes $APPDIR only if
      # the kernel's mount table shows a fuse.<image name> mount whose source is
      # the image name. Prove the real runtime still reports exactly that.
      - name: The real AppImage mount matches what the helper launch check expects
        run: |
          # The packaged app checks itself with --synbench-selfcheck (the same C++ the real
          # launch uses; a text check of mountinfo once passed while the real check failed
          # on every AppImage); the raw mountinfo line is checked as well.
          # The kernel octal-escapes space, #, backslash and tab in mountinfo fields
          # (the fs type included), so check a plain name, a name with spaces and
          # parentheses, and a launch through a symlink (the runtime reports the
          # real file's name then; $APPIMAGE is the real path too).
          check_mount() {  # <command to launch> <expected image file name, unescaped>
            local launcher=$1 expected=$2
            # THE check: the packaged app's own C++ launch decision, run on the live
            # mount (read-only, no root, no polkit, no window). It must pass.
            local report
            report=$(./"$launcher" --synbench-selfcheck) || { echo "$report"; echo "::error::--synbench-selfcheck failed for '$launcher'"; exit 1; }
            echo "$report"
            grep -q '^PASS: AppImage ' <<<"$report" || { echo "::error::selfcheck did not report a verified AppImage"; exit 1; }
            ./"$launcher" --appimage-mount > mount.txt &
            local mount_pid=$!
            for _ in $(seq 1 20); do [ -s mount.txt ] && break; sleep 0.5; done
            local mnt line escaped
            mnt=$(head -1 mount.txt)
            line=$(awk -v m="$mnt" '$5 == m' /proc/self/mountinfo)
            echo "mountinfo: $line"
            kill "$mount_pid" || true
            wait "$mount_pid" 2>/dev/null || true
            escaped=${expected// /\\040}
            case "$line" in
              *" - fuse.$escaped $escaped "*) ;;
              *) echo "::error::mount of '$launcher' is not 'fuse.$escaped $escaped' as the helper launch check expects"; exit 1 ;;
            esac
          }
          check_mount "$APPIMAGE_FILE" "$APPIMAGE_FILE"
          cp "$APPIMAGE_FILE" "SynBench test (1).AppImage"
          check_mount "SynBench test (1).AppImage" "SynBench test (1).AppImage"
          ln -s "SynBench test (1).AppImage" link-to-it.AppImage
          check_mount "link-to-it.AppImage" "SynBench test (1).AppImage"

      # No smoke switch in a packaged build: it must start with its bundled
      # libraries and stay up (the administrator prompt then fails: no polkit
      # agent here). timeout exits 124 when the app was still running.
      - name: The AppImage starts and stays up
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 15 ./"$APPIMAGE_FILE"
          code=$?
          [ "$code" -eq 124 ] || { echo "::error::SynBench exited with $code within 15 s"; exit 1; }

      - name: Upload the AppImage
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          retention-days: 3
          name: SynBench-linux-x86_64-AppImage
          path: ${{ env.APPIMAGE_FILE }}
          if-no-files-found: error

  package-windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1 (= v1.13.0)
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4 (= v4.4.1)
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          aqtsource: ${{ env.AQT_SOURCE }}

      - name: Find the x64 runtime DLLs
        shell: pwsh
        run: |
          $crt = ./packaging/windows/find-crt.ps1 -Arch x64
          "SYNBENCH_CRT_DIRS=$crt" | Out-File -FilePath $env:GITHUB_ENV -Append

      # OpenSSL's x64 AES-NI / SHA-NI / VAES code is NASM source (§11.2). nasm.us
      # publishes no checksums or signatures; this SHA-256 is the one winget's
      # NASM.NASM 2.16.03 manifest records for the same file, and the download
      # from nasm.us matched it on 2026-10-16.
      - name: Install NASM 2.16.03
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\nasm-2.16.03-installer-x64.exe"
          Invoke-WebRequest -Uri https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-installer-x64.exe -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '657e1252676cfb26a008835c20a760f731c8e0414469a4ed0f83f0fb059cdd35') { throw "NASM installer has sha256 $hash" }
          # NSIS: silent, into a folder of our own (/D= last, unquoted).
          $p = Start-Process -FilePath $exe -ArgumentList '/S', "/D=$env:RUNNER_TEMP\nasm" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "NASM installer exited $($p.ExitCode)" }
          & "$env:RUNNER_TEMP\nasm\nasm.exe" -v
          if ($LASTEXITCODE -ne 0) { throw "nasm does not run" }
          "$env:RUNNER_TEMP\nasm" | Out-File -FilePath $env:GITHUB_PATH -Append

      # OpenSSL (§11, R8): its build is cached, keyed on everything that goes into
      # it; cmake/OpenSSL.cmake checks the stamp in the folder and rebuilds on
      # any mismatch. nmake builds it on one core: 10-15 minutes uncached.
      - name: OpenSSL cache
        uses: actions/cache@v4
        with:
          path: openssl-root
          key: openssl-VC-WIN64A-msvc${{ env.VCToolsVersion }}-nasm2.16.03-${{ hashFiles('cmake/OpenSSL.cmake', 'cmake/openssl/**') }}

      - name: Configure (packaging preset)
        shell: pwsh
        run: cmake --preset windows-x64-package "-DSYNBENCH_CRT_DIRS=$env:SYNBENCH_CRT_DIRS" "-DSYNBENCH_OPENSSL_ROOT=$env:GITHUB_WORKSPACE/openssl-root"

      - name: Build
        run: cmake --build --preset windows-x64-package

      # §11.2: the hardware AES and SHA-256 code is in libcrypto; the check also
      # has to fail without it (self-test, and on a library that isn't libcrypto).
      - name: libcrypto has the hardware crypto path (AES-NI, SHA-NI)
        shell: pwsh
        run: |
          $nm = (Get-Command llvm-nm -ErrorAction SilentlyContinue).Source
          if (-not $nm) { $nm = @("$env:VCINSTALLDIR\Tools\Llvm\x64\bin\llvm-nm.exe", "$env:ProgramFiles\LLVM\bin\llvm-nm.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          if (-not $nm) { throw "no llvm-nm on this runner" }
          python packaging/checks/crypto-symbols.py openssl-root/lib/libcrypto.lib --arch x86_64 --nm $nm --self-test
          if ($LASTEXITCODE -ne 0) { throw "the hardware crypto check failed" }
          python packaging/checks/crypto-symbols.py build/windows-x64-package/_deps/synbench_zlib-build/zlibs.lib --arch x86_64 --nm $nm
          if ($LASTEXITCODE -eq 0) { throw "crypto-symbols.py passed on zlib" }
          $global:LASTEXITCODE = 0

      # For diagnosis when the manifest check below fails: the real link command.
      - name: Show how SynBench.exe was linked
        shell: pwsh
        run: ninja -C build/windows-x64-package -t commands bin/SynBench.exe | Select-Object -Last 1

      - name: The exe has exactly one manifest, requesting administrator rights
        shell: pwsh
        run: ./packaging/checks/manifest-check.ps1 -Exe build/windows-x64-package/bin/SynBench.exe

      - name: Install and deploy Qt
        shell: pwsh
        run: |
          cmake --install build/windows-x64-package --prefix stage
          ./packaging/windows/deploy.ps1 -Stage stage -HostQt $env:QT_ROOT_DIR

      - name: Static checks on the stage tree (hooks, test binaries, architecture, dependencies, runtime)
        shell: pwsh
        run: ./packaging/checks/windows-static-checks.ps1 -Tree stage -Arch x64

      # A check that cannot fail proves nothing: plant defects in a copy and
      # require the checks to reject each one.
      - name: Negative control, the static checks fail on planted defects
        shell: pwsh
        run: ./packaging/checks/test-windows-static-checks.ps1 -Tree stage -Arch x64

      - name: Versions
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $p = $v.Split('.')
          $msi = "$($p[0].Substring(2)).$($p[1]).$($p[2])"
          "SYNBENCH_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SYNBENCH_MSI_VERSION=$msi" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Trust: Inno Setup is normally preinstalled on the runner image; otherwise it
      # comes from Chocolatey, whose package carries the installer's checksum and
      # verifies it. WiX is a dotnet tool at an exact version (5.0.2), installed from
      # nuget.org, whose repository signature the NuGet client checks. Neither has a
      # hash pinned here: a SHA-256 for either would have to be copied from the
      # publisher's own site, which proves no more than those two checks.
      - name: Install Inno Setup and WiX
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build the Inno installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\synbench.iss `
            "/DAppVersion=$env:SYNBENCH_VERSION" /DArch=x64 "/DSourceDir=$PWD\stage" "/DOutputDir=$PWD\out"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Build the MSI
        shell: pwsh
        run: |
          wix build -arch x64 -d "Version=$env:SYNBENCH_MSI_VERSION" -d "SourceDir=$PWD\stage" -d "Arch=x64" -d "IconPath=$PWD\assets\synbench.ico" `
            -d "UpgradeCode={5E2C6D1B-8B1A-4C3E-9F55-0A6B2D7E4C11}" `
            -o "out\SynBench-$env:SYNBENCH_VERSION-windows-x64.msi" packaging\windows\wix\Package.wxs
          if ($LASTEXITCODE -ne 0) { throw "wix build failed" }

      # D10: the real Python v0.2.3 installer, to upgrade over.
      - name: Fetch the Python v0.2.3 installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.2.3 --repo $env:GITHUB_REPOSITORY --pattern 'SynBench-Setup.exe' --dir old
          # The asset's published digest: a different file would make the upgrade test meaningless.
          $hash = (Get-FileHash old\SynBench-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '58c5d4cd912513648b21d079969c773586becfd245fcd1bdcc7430dca549c3f8') { throw "SynBench-Setup.exe of v0.2.3 has sha256 $hash" }

      - name: Silent install, launch, uninstall (Inno and MSI) and the upgrade over v0.2.3
        shell: pwsh
        timeout-minutes: 10
        run: |
          ./packaging/windows/test-install.ps1 `
            -Inno "out\SynBench-$env:SYNBENCH_VERSION-windows-x64-setup.exe" `
            -Msi "out\SynBench-$env:SYNBENCH_VERSION-windows-x64.msi" `
            -OldInstaller old\SynBench-Setup.exe -Version $env:SYNBENCH_VERSION

      - name: Upload install logs
        if: failure()
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          retention-days: 3
          name: install-logs-windows-x64
          path: ${{ runner.temp }}/install-logs
          if-no-files-found: ignore

      - name: Upload the installers
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          retention-days: 3
          name: SynBench-windows-x64-installers
          path: out/*
          if-no-files-found: error

  # Cross builds (D13): nothing here is ever executed. The static checks
  # (P27) are the whole validation until someone runs the result.
  package-windows-arm64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSVC (x64 -> ARM64 cross tools)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1 (= v1.13.0)
        with:
          arch: amd64_arm64

      - name: Install the host Qt (x64)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4 (= v4.4.1)
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          aqtsource: ${{ env.AQT_SOURCE }}

      - name: Install the target Qt (ARM64, cross-compiled)
        shell: pwsh
        run: |
          $host_qt = $env:QT_ROOT_DIR
          python -m pip install --quiet "$env:AQT_SOURCE"
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_arm64_cross_compiled -O "$env:RUNNER_TEMP\qt-arm64"
          if ($LASTEXITCODE -ne 0) { throw "aqt failed" }
          $target = Get-ChildItem "$env:RUNNER_TEMP\qt-arm64\$env:QT_VERSION" -Directory | Select-Object -First 1
          "HOST_QT=$host_qt" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TARGET_QT=$($target.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      # OpenSSL's VC-WIN64-CLANGASM-ARM target (N4) assembles its ARMv8 Crypto
      # code with clang-cl: Visual Studio's C++ Clang tools, else LLVM.
      - name: clang-cl on PATH (OpenSSL's ARM64 assembler)
        shell: pwsh
        run: |
          $dir = @("$env:VCINSTALLDIR\Tools\Llvm\x64\bin", "$env:ProgramFiles\LLVM\bin") | Where-Object { Test-Path "$_\clang-cl.exe" } | Select-Object -First 1
          if (-not $dir) { throw "no clang-cl on this runner (Visual Studio's C++ Clang tools)" }
          & "$dir\clang-cl.exe" --version
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Find the ARM64 runtime DLLs
        shell: pwsh
        run: |
          $crt = ./packaging/windows/find-crt.ps1 -Arch arm64
          "SYNBENCH_CRT_DIRS=$crt" | Out-File -FilePath $env:GITHUB_ENV -Append

      # OpenSSL (§11, R8): its build is cached, keyed on everything that goes into
      # it; cmake/OpenSSL.cmake checks the stamp in the folder and rebuilds on
      # any mismatch. nmake builds it on one core: 10-15 minutes uncached.
      - name: OpenSSL cache
        uses: actions/cache@v4
        with:
          path: openssl-root
          key: openssl-VC-WIN64-CLANGASM-ARM-msvc${{ env.VCToolsVersion }}-${{ hashFiles('cmake/OpenSSL.cmake', 'cmake/openssl/**') }}

      - name: Configure (cross)
        shell: pwsh
        run: |
          cmake --preset windows-arm64-cross "-DQT_HOST_PATH=$env:HOST_QT" "-DCMAKE_PREFIX_PATH=$env:TARGET_QT" `
            "-DSYNBENCH_CRT_DIRS=$env:SYNBENCH_CRT_DIRS" "-DSYNBENCH_OPENSSL_ROOT=$env:GITHUB_WORKSPACE/openssl-root"

      - name: Build
        run: cmake --build --preset windows-arm64-cross

      # §11.2: the hardware AES and SHA-256 code is in libcrypto; the check also
      # has to fail without it (self-test, and on a library that isn't libcrypto).
      - name: libcrypto has the hardware crypto path (ARMv8 Crypto; VC-WIN64-CLANGASM-ARM)
        shell: pwsh
        run: |
          $nm = (Get-Command llvm-nm -ErrorAction SilentlyContinue).Source
          if (-not $nm) { $nm = @("$env:VCINSTALLDIR\Tools\Llvm\x64\bin\llvm-nm.exe", "$env:ProgramFiles\LLVM\bin\llvm-nm.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          if (-not $nm) { throw "no llvm-nm on this runner" }
          python packaging/checks/crypto-symbols.py openssl-root/lib/libcrypto.lib --arch aarch64 --nm $nm --self-test
          if ($LASTEXITCODE -ne 0) { throw "the hardware crypto check failed" }
          python packaging/checks/crypto-symbols.py build/windows-arm64-cross/_deps/synbench_zlib-build/zlibs.lib --arch aarch64 --nm $nm
          if ($LASTEXITCODE -eq 0) { throw "crypto-symbols.py passed on zlib" }
          $global:LASTEXITCODE = 0

      # For diagnosis when the manifest check below fails: the real link command.
      - name: Show how SynBench.exe was linked
        shell: pwsh
        run: ninja -C build/windows-arm64-cross -t commands bin/SynBench.exe | Select-Object -Last 1

      - name: The exe has exactly one manifest, requesting administrator rights
        shell: pwsh
        run: ./packaging/checks/manifest-check.ps1 -Exe build/windows-arm64-cross/bin/SynBench.exe

      - name: Install and deploy Qt (host tool, target Qt)
        shell: pwsh
        run: |
          cmake --install build/windows-arm64-cross --prefix stage
          ./packaging/windows/deploy.ps1 -Stage stage -HostQt $env:HOST_QT -TargetQt $env:TARGET_QT

      - name: Static checks (P27) - hooks, test binaries, ARM64 only, every dependency, the runtime
        shell: pwsh
        run: ./packaging/checks/windows-static-checks.ps1 -Tree stage -Arch arm64

      - name: Negative control, the static checks fail on planted defects
        shell: pwsh
        run: ./packaging/checks/test-windows-static-checks.ps1 -Tree stage -Arch arm64

      - name: Versions
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $p = $v.Split('.')
          "SYNBENCH_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SYNBENCH_MSI_VERSION=$($p[0].Substring(2)).$($p[1]).$($p[2])" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Trust: Inno Setup is normally preinstalled on the runner image; otherwise it
      # comes from Chocolatey, whose package carries the installer's checksum and
      # verifies it. WiX is a dotnet tool at an exact version (5.0.2), installed from
      # nuget.org, whose repository signature the NuGet client checks. Neither has a
      # hash pinned here: a SHA-256 for either would have to be copied from the
      # publisher's own site, which proves no more than those two checks.
      - name: Install Inno Setup and WiX
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      # ISCC and WiX are x64 tools; they build the ARM64 installers fine.
      - name: Build the ARM64 Inno installer and MSI
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\synbench.iss `
            "/DAppVersion=$env:SYNBENCH_VERSION" /DArch=arm64 "/DSourceDir=$PWD\stage" "/DOutputDir=$PWD\out"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          wix build -arch arm64 -d "Version=$env:SYNBENCH_MSI_VERSION" -d "SourceDir=$PWD\stage" -d "Arch=arm64" -d "IconPath=$PWD\assets\synbench.ico" `
            -d "UpgradeCode={A3D49B72-6E0F-4F1D-B6A8-7C1E5F90D2B4}" `
            -o "out\SynBench-$env:SYNBENCH_VERSION-windows-arm64.msi" packaging\windows\wix\Package.wxs
          if ($LASTEXITCODE -ne 0) { throw "wix build failed" }

      - name: Upload the installers
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          retention-days: 3
          name: SynBench-windows-arm64-installers
          path: out/*
          if-no-files-found: error

  linux-arm64-cross:
    runs-on: ubuntu-24.04
    env:
      SYSROOT: ${{ github.workspace }}/sysroot-arm64
    steps:
      - uses: actions/checkout@v5

      # Linux ARM64 requires glibc 2.39 (Ubuntu 24.04+): the official Qt arm64
      # build needs glibc 2.38 / libstdc++ 3.4.32. Runner, compiler (GCC 13) and
      # sysroot (noble) are all 24.04, so their libstdc++ agree.
      - name: Install the cross compiler and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            mmdebstrap desktop-file-utils libgl1-mesa-dev

      # P26: the sysroot comes from the cache, keyed on the package list; on a
      # miss it is built here (sysroot-arm64.yml pre-warms it).
      - name: Sysroot cache
        id: sysroot
        uses: actions/cache@v4
        with:
          path: sysroot-arm64
          key: sysroot-arm64-noble-${{ hashFiles('packaging/linux/linux-arm64-sysroot.txt', 'packaging/linux/make-sysroot.sh', 'packaging/linux/fix-sysroot-symlinks.py') }}

      - name: Build the sysroot
        if: steps.sysroot.outputs.cache-hit != 'true'
        run: bash packaging/linux/make-sysroot.sh "$SYSROOT"

      - name: Install the host Qt (x64)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4 (= v4.4.1)
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
          aqtsource: ${{ env.AQT_SOURCE }}

      - name: Install the target Qt (ARM64)
        run: |
          python3 -m pip install --quiet "$AQT_SOURCE"
          python3 -m aqt install-qt linux_arm64 desktop "$QT_VERSION" linux_gcc_arm64 -O "$RUNNER_TEMP/qt-arm64"
          echo "HOST_QT=$QT_ROOT_DIR" >> "$GITHUB_ENV"
          echo "TARGET_QT=$RUNNER_TEMP/qt-arm64/$QT_VERSION/gcc_arm64" >> "$GITHUB_ENV"

      # OpenSSL (§11, R8): its build is cached, keyed on everything that goes into
      # it; cmake/OpenSSL.cmake checks the stamp in the folder and rebuilds on
      # any mismatch.
      - name: Compiler version (OpenSSL cache key)
        id: cc
        run: echo "version=$(aarch64-linux-gnu-gcc -dumpfullversion)" >> "$GITHUB_OUTPUT"
      - name: OpenSSL cache
        uses: actions/cache@v4
        with:
          path: openssl-root
          key: openssl-linux-aarch64-gcc${{ steps.cc.outputs.version }}-${{ hashFiles('cmake/OpenSSL.cmake', 'cmake/openssl/**') }}

      - name: Configure (cross)
        run: |
          cmake --preset linux-arm64-cross \
            -DSYNBENCH_SYSROOT="$SYSROOT" -DSYNBENCH_TARGET_QT="$TARGET_QT" \
            -DQT_HOST_PATH="$HOST_QT" -DCMAKE_PREFIX_PATH="$TARGET_QT" \
            -DSYNBENCH_OPENSSL_ROOT="$GITHUB_WORKSPACE/openssl-root"

      - name: Build
        run: cmake --build --preset linux-arm64-cross

      # §11.2: the only proof the ARM64 build has the ARMv8 Crypto path (ARM
      # never runs in CI); the check also has to fail without it.
      - name: libcrypto has the hardware crypto path (ARMv8 Crypto)
        run: |
          python3 packaging/checks/crypto-symbols.py openssl-root/lib/libcrypto.a --arch aarch64 --nm aarch64-linux-gnu-nm --self-test
          if python3 packaging/checks/crypto-symbols.py build/linux-arm64-cross/_deps/synbench_zlib-build/libz.a --arch aarch64 --nm aarch64-linux-gnu-nm; then
            echo "::error::crypto-symbols.py passed on zlib"; exit 1
          fi

      - name: Install
        run: cmake --install build/linux-arm64-cross --prefix stage

      - name: The packaged binaries carry no developer hooks and no test binaries
        run: |
          bash packaging/checks/no-dev-hooks.sh stage
          bash packaging/checks/no-test-binaries.sh stage

      - name: Build the AppDir (cross, aarch64 readelf, sysroot library search)
        run: |
          python3 packaging/linux/make-appdir.py \
            --install-tree stage --appdir AppDir --qt "$TARGET_QT" \
            --qml-root src/app/qml --qml-scanner "$HOST_QT/libexec/qmlimportscanner" \
            --cross-prefix aarch64-linux-gnu- --sysroot "$SYSROOT"

      - name: Static checks (P27, the aarch64 floor is glibc 2.39)
        run: |
          python3 packaging/checks/elf-check.py AppDir --arch aarch64 --cross-prefix aarch64-linux-gnu-
          for f in libqwayland.so libqxcb.so; do test -f "AppDir/usr/plugins/platforms/$f" || { echo "::error::$f is not in the AppDir"; exit 1; }; done
          test -n "$(find AppDir/usr/plugins/wayland-shell-integration -name 'libxdg-shell.so')"
          bash packaging/checks/no-dev-hooks.sh AppDir
          bash packaging/checks/no-test-binaries.sh AppDir
          # The check must also FAIL on a planted bad binary: an x86_64 file in the aarch64 tree.
          mkdir -p planted && cp /bin/true planted/true
          if python3 packaging/checks/elf-check.py planted --arch aarch64 --cross-prefix aarch64-linux-gnu- 2>/dev/null; then
            echo "::error::elf-check passed on a planted x86_64 binary"; exit 1
          fi

      - name: Build the AppImage (x86_64 appimagetool, aarch64 runtime)
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          bash packaging/linux/make-appimage.sh AppDir "SynBench-$version-aarch64.AppImage" aarch64 appimage-tools
          echo "APPIMAGE_FILE=SynBench-$version-aarch64.AppImage" >> "$GITHUB_ENV"

      # N1: a CI artifact only; it is never run, so it stays out of Releases.
      - name: Upload the AppImage (artifact only)
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          retention-days: 3
          name: SynBench-linux-aarch64-AppImage
          path: ${{ env.APPIMAGE_FILE }}
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck desktop-file-utils appstream
          # Pinned release, checked against its SHA-256 before it is unpacked or run.
          curl -fsSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/

      - name: Workflows (actionlint)
        run: actionlint

      - name: Shell scripts (shellcheck)
        run: shellcheck packaging/checks/*.sh packaging/linux/*.sh

      - name: Python scripts compile
        run: python3 -m py_compile packaging/linux/make-appdir.py packaging/linux/fix-sysroot-symlinks.py packaging/checks/elf-check.py packaging/checks/qmllint-gate.py packaging/checks/crypto-symbols.py

      - name: Desktop file and AppStream metadata
        run: |
          desktop-file-validate packaging/linux/io.github.dakotlyar.SynBench.desktop
          sed "s/@SYNBENCH_VERSION@/$(tr -d '[:space:]' < VERSION)/; s/@SYNBENCH_RELEASE_DATE@/$(date -u +%F)/" \
            packaging/linux/io.github.dakotlyar.SynBench.metainfo.xml.in > metainfo-check.xml
          appstreamcli validate --no-net metainfo-check.xml
