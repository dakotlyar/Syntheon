name: CI

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.12.0"
  # R1: aqtinstall 3.3.0 (latest release) can't find Qt 6.12.0 for Windows
  # (Qt moved 6.12 to per-arch repo folders). Its master at this commit can,
  # for both Linux and Windows. Move back to a release once one ships.
  AQT_SOURCE: "git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgl1-mesa-dev libegl1-mesa-dev \
            libxkbcommon-dev libfontconfig1-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
          aqtsource: ${{ env.AQT_SOURCE }}

      - name: Configure
        run: cmake --preset linux-x64-release

      - name: Build
        run: cmake --build --preset linux-x64-release

  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          aqtsource: ${{ env.AQT_SOURCE }}

      - name: Configure
        run: cmake --preset windows-x64-release

      - name: Build
        run: cmake --build --preset windows-x64-release
